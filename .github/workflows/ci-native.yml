name: Flask Todo CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  validate-and-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==23.3.2"
          pip install -r requirements.txt "Werkzeug==0.16.1" "MarkupSafe==2.0.1" "itsdangerous==1.1.0" "click==7.1.2" "SQLAlchemy==1.3.24"

      - name: Initialize SQLite database
        run: |
          rm -f todo.sqlite
          python -c "from application import create_app; from application.extensions import db; app = create_app('default'); app.app_context().push(); db.create_all(); print('SQLite initialized:', app.config['SQLALCHEMY_DATABASE_URI'])"

      - name: Smoke test Flask server
        run: |
          nohup python manage.py runserver > server.log 2>&1 &
          sleep 6
          curl -sS -D - -o /dev/null http://127.0.0.1:7345/
          curl -fsS -o /dev/null http://127.0.0.1:7345/
          echo "Smoke test OK: Flask server responded with HTTP 200"

      - name: Show Flask server log
        if: always()
        run: cat server.log
